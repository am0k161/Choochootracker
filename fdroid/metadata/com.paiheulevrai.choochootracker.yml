Summary: Music tracker and groovebox with synthesis, samples, MIDI and WAV export
Description: |-
    ChooChooTracker is a music tracker and groovebox for Android. Compose songs
    with a gamepad, hardware keyboard or on-screen controls, in portrait or
    landscape.

    It includes synthesis engines, sample playback, effects, MIDI support and
    WAV export. Projects and samples stay on your device. Import files and save
    exports through Android's document picker, or use a shared working folder.

    Ableton Link can synchronize tempo with other apps and devices on the same
    local network. No account is required.

RepoType: git
Repo: https://github.com/paiheulevrai/Choochootracker.git

Builds:
  - versionName: 1.0.21-alpha
    versionCode: 21
    commit: v1.0.21-alpha
    subdir: tracker/platforms/android
    submodules: true
    srclibs:
      - SDL@release-2.32.10
    scandelete:
      - tracker/packaging/rg35xx/j2k.so
      - tracker/platforms/android/app/src/main/jniLibs/arm64-v8a/libSDL2.so
      - tracker/platforms/android/app/src/main/jniLibs/armeabi-v7a/libSDL2.so
      - tracker/platforms/android/gradle/wrapper/gradle-wrapper.jar
    build:
      - cd ../.. && export ANDROID_NDK_ROOT="$ANDROID_NDK" && bash platforms/android/build-sdl2-android.sh $$SDL$$ && mkdir -p ../.tmp/SDL2-2.32.10/SDL2 && cp build/sdl2-android/include/*.h ../.tmp/SDL2-2.32.10/SDL2/
    gradle:
      - direct
    ndk: 30.0.16248370

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.21-alpha
CurrentVersionCode: 21
